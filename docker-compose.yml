services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: roadexpress_hrms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrms_db}
      POSTGRES_USER: ${POSTGRES_USER:-hrms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrms_user} -d ${POSTGRES_DB:-hrms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roadexpress_hrms_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-04-06T05-26-02Z
    container_name: roadexpress_hrms_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadexpress_hrms_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENABLE_PGVECTOR=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-hrms_user}:${POSTGRES_PASSWORD:-hrms_pass}@postgres:5432/${POSTGRES_DB:-hrms_db}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_PUBLIC_URL=http://localhost:9000
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             python scripts/create_admin.py --name 'HR Admin' --email 'admin@roadexpress.com' --password 'AdminPass123!' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadexpress_hrms_celery_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - ENABLE_PGVECTOR=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-hrms_user}:${POSTGRES_PASSWORD:-hrms_pass}@postgres:5432/${POSTGRES_DB:-hrms_db}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_PUBLIC_URL=http://localhost:9000
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: celery -A app.workers.celery_app.celery worker --loglevel=info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadexpress_hrms_celery_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - ENABLE_PGVECTOR=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-hrms_user}:${POSTGRES_PASSWORD:-hrms_pass}@postgres:5432/${POSTGRES_DB:-hrms_db}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app.celery beat --loglevel=info

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadexpress_hrms_flower
    restart: unless-stopped
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app.celery flower --port=5555

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roadexpress_hrms_hr_portal
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    env_file:
      - ./frontend/.env.local
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      - INTERNAL_API_URL=http://backend:8000/v1
      - NEXT_PUBLIC_API_URL=http://localhost:8000/v1
    command: npm run dev

  user-frontend:
    build:
      context: ./user-frontend
      dockerfile: Dockerfile
    container_name: roadexpress_hrms_candidate_portal
    restart: unless-stopped
    ports:
      - "${USER_FRONTEND_PORT:-3000}:3000"
    env_file:
      - ./user-frontend/.env.local
    volumes:
      - ./user-frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      - INTERNAL_API_URL=http://backend:8000/v1
      - NEXT_PUBLIC_API_URL=http://localhost:8000/v1
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  minio_data:
