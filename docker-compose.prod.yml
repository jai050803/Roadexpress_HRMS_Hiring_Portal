services:
  postgres:
    restart: always

  redis:
    restart: always

  backend:
    restart: always
    volumes: []
    environment:
      - APP_ENV=production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  celery-worker:
    restart: always
    volumes: []
    environment:
      - APP_ENV=production
    command: celery -A app.workers.celery_app.celery worker --loglevel=warning --concurrency=4

  celery-beat:
    restart: always
    volumes: []
    environment:
      - APP_ENV=production
    command: celery -A app.workers.celery_app.celery beat --loglevel=warning

  flower:
    restart: always
    volumes: []
    environment:
      - APP_ENV=production
    command: celery -A app.workers.celery_app.celery flower --port=5555

  frontend:
    restart: always
    volumes: []
    environment:
      - NODE_ENV=production
    command: npm run start

  user-frontend:
    restart: always
    volumes: []
    environment:
      - NODE_ENV=production
    command: npm run start
